setupVersion: 3
modelRoles:
  default: openai-codex/gpt-6-astra
  slow: openai-codex/gpt-6-astra
  plan: openai-codex/gpt-6-astra
  smol: openai-codex/gpt-5.6-sol
  judge: openai-codex/gpt-5.6-luna
  vision: openai-codex/gpt-5.6-sol
  task: openai-codex/gpt-5.6-luna
  web: openai-codex/gpt-5.6-luna
  commit: openai-codex/gpt-5.6-luna
symbolPreset: nerd
composer:
  shape: box
theme:
  dark: dark-tokyo-night
compaction:
  reserveTokens: 16384
bash:
  patterns:
    - match: git commit*
      approval: prompt
    - match: "*git commit*"
      approval: prompt
    - match: git push*
      approval: prompt
    - match: "*git push*"
      approval: prompt
    - match: git tag*
      approval: prompt
    - match: "*git tag*"
      approval: prompt
memory:
  backend: local
autolearn:
  enabled: true
prewalk:
  enabled: false
bashInterceptor:
  enabled: true
defaultThinkingLevel: high
tools:
  approvalMode: yolo
checkpoint:
  enabled: true
astGrep:
  enabled: true
codexResets:
  autoRedeem: "no"
tui:
  vimMode: true
  vimModeDisplay: text
retry:
  fallbackChains:
    openai-codex/gpt-6-astra:
      - anthropic/claude-opus-5-5:xhigh
    openai-codex/gpt-5.6-sol:
      - anthropic/claude-sonnet-5
    openai-codex/gpt-5.6-luna:
      - anthropic/claude-sonnet-5
dev:
  autoqaConsent: granted
claudeResets:
  autoRedeem: "no"
hideThinkingBlock: false
update:
  auto: false