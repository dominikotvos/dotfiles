# Gintama Shiroyasha x Shinsengumi palette, written literally.
#
# Nothing is bound to hyprlock any more - SUPER+L goes to `noctalia msg session
# lock`. This config is kept as a manual fallback for when noctalia is not
# running, since the noctalia lockscreen dies with the shell process. Run it as
# plain `hyprlock` from a terminal.
#
# Previously sourced ~/.cache/wal/colors-hyprlock, which no longer exists -
# every color below was undefined and the lockscreen rendered broken.

$surface   = rgba(13, 15, 18, 1.0)
$asagi     = rgba(111, 197, 217, 1.0)
$silver    = rgba(214, 219, 224, 1.0)
$blood     = rgba(179, 18, 29, 1.0)
$gold      = rgba(201, 162, 39, 1.0)

general {
    hide_cursor = false
}

background {
    monitor =
    color = $surface
}

label {
    monitor =
    text = cmd[update:60000] echo "<b><big> $(date '+%H:%M') </big></b>"
    position = 0, 40%
    font_size = 50
    font_family = IBM Plex Sans
    color = $silver
}

label {
    monitor =
    text = cmd[update:60000] echo "<big> $(date '+%A, %B %d') </big>"
    position = 0, 33%
    font_size = 40
    font_family = IBM Plex Sans
    color = $asagi
}

input-field {
    monitor =
    size = 10%, 5%
    outline_thickness = 2

    placeholder_text = <i>Password</i>
    fail_text = <i><b>Silly...</b></i>

    font_family = IBM Plex Sans
    font_color = $silver

    outer_color = $asagi
    inner_color = $surface
    check_color = $asagi
    fail_color  = $blood
    capslock_color = $gold

    fade_on_empty = false
    rounding = 2

    position = 0, -5%
    halign = center
    valign = center
}
