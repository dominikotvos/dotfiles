# Reference copy of the noctalia settings we author by hand.
#
# Live file is ~/.local/state/noctalia/settings.toml - that is STATE, rewritten by
# the daemon, so it is not symlinked. This records the non-obvious parts.
#
# Schema notes learned the hard way:
#   * workspaces is a TOP-LEVEL [widget.workspaces], NOT under [bar.default].
#     label_source = "name" shows the kanji names set in hyprland.lua.
#   * a widget is removed from the bar with [widget.<id>] enabled = false.
#   * bar widget ORDER is [bar.default] start / center / end arrays (NOT
#     start_widgets / widgets_start - those are rejected).
#   * capsules are per-widget ([widget.<id>] capsule = true); the bar-level
#     capsule_* keys only style them. Currently off - they looked boxy.
#   * bar.default.border / capsule_fill / capsule_border take a ColorSpec string
#     (a palette token name like "outline"), not a bool.
#   * the kanji sigil is a `text`-family widget, NOT an image: custom_button with
#     `label`. It inherits the bar font/size for free. widget.launcher.glyph only
#     takes TABLER ICON NAMES, which is why the first attempt used a PNG.
#   * click bindings go in [widget.<n>.actions] left/right/middle - a bare
#     `command` key still parses but warns as deprecated.
#   * docs: https://docs.noctalia.dev/noctalia/bar/widgets/
#   * `noctalia config validate` names every unknown key - use it to probe.#   * plugin widget ids in a bar array are fully qualified: "author/plugin:entry".
#   * enabling a plugin makes the daemon re-export settings.toml in the
#     background, which silently drops concurrent hand edits - edit AFTER.
#   * local plugins live in ~/.local/share/noctalia/plugins/<dir> (symlinked here).
#   * a NEW [[panel]] in a plugin manifest is not picked up by config-reload;
#     the plugin must be disabled and re-enabled before panel-toggle knows it.


[bar.default]
border = "outline"
border_width = 1
center = [ "clock" ]
concave_edge_corners = true
end = [
    "sleuth/fcitx5:fcitx5",
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
font_family = "Noto Sans CJK JP"
font_scale = 1.05
font_weight = 600
hover_highlight = true
margin_ends = 0
padding = 8
radius = 0
start = [ "gin", "workspaces" ]
thickness = 30
widget_spacing = 8

[widget.gin]
glyph = ""
label = "銀"
type = "custom_button"

    [widget.gin.actions]
    left = "panel-toggle launcher"

[widget.wallpaper]
enabled = false

[widget.workspaces]
font_scale = 1.3
label_source = "name"
style = "minimal"

[widget.tray]
hidden = [ "Fcitx" ]

[theme.templates]
    builtin_ids = [ "hyprland", "kitty", "ghostty", "alacritty", "gtk3", "gtk4", "qt", "kcolorscheme", "btop" ]

[shell]
avatar_path = "/home/sleuth/Pictures/Gintoki.jpg"
