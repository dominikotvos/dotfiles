[bar.default]
border = "outline"
border_width = 1
center = [ "clock_hu", "clock_sep", "clock_kr" ]
concave_edge_corners = true
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "sleuth/fcitx5:fcitx5",
    "control-center",
    "session"
]
font_family = "Noto Sans CJK JP"
font_scale = 1.05
font_weight = 600
hover_highlight = true
margin_ends = 0
padding = 8
radius = 0
start = [ "gin", "workspaces" ]
thickness = 30
widget_spacing = 8

[calendar]

[control_center]
sidebar = true
width = 440

    [control_center.calendar]
    show_events_card = false

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[location]
auto_locate = true

[lockscreen]
allow_empty_password = false
blur_intensity = 0.40000000000000002
blurred_desktop = false
enabled = true
fingerprint = false
lock_before_suspend = true
monitors = []
tint_intensity = 0.5
wallpaper = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 8.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = false

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 8.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = false

[notification]
background_opacity = 0.93999999999999995
border = "outline"
collapse_on_dismiss = true
history_retention_hours = 48
keep_dismissed_in_history = true
max_visible = 3
offset_x = 8
offset_y = 8
show_actions = true
show_app_name = true

[plugins]
enabled = [ "sleuth/fcitx5" ]

[shell]
avatar_path = "/home/sleuth/Pictures/Gintoki.jpg"

[theme]
builtin = "Tokyo-Night"
community_palette = "Aura"
custom_palette = "gintama-shiroyasha"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "hyprland", "kitty", "ghostty", "alacritty", "gtk3", "gtk4", "qt", "kcolorscheme", "btop" ]

[wallpaper.default]
path = "/home/sleuth/Pictures/wallpapers/gintoki-wave.jpg"

[wallpaper.last]
path = "/home/sleuth/Pictures/wallpapers/gintoki-wave.jpg"

[wallpaper.monitors.DP-1]
path = "/home/sleuth/Pictures/wallpapers/gintoki-wave.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/sleuth/Pictures/wallpapers/gintoki-wave.jpg"

[widget.clock_hu]
format = "HU {:%H:%M}"
timezone = "Europe/Budapest"
tooltip_format = "Budapest  {:%A, %d %B %Y  %H:%M}"
type = "clock"

[widget.clock_kr]
format = "KR {:%H:%M}  ·  {:%a %d %b}"
timezone = "Asia/Seoul"
tooltip_format = "Seoul  {:%A, %d %B %Y  %H:%M}"
type = "clock"

[widget.clock_sep]
text = "·"
type = "text"

[widget.gin]
glyph = ""
label = "銀"
type = "custom_button"

    [widget.gin.actions]
    left = "panel-toggle launcher"

[widget.tray]
hidden = [ "Fcitx" ]

[widget.wallpaper]
enabled = false

[widget.workspaces]
empty_color = "on_surface_variant"
focused_color = "#C9E0EF"
focused_output_only = true
font_scale = 1.3
label_source = "name"
occupied_color = "primary"
style = "minimal"
